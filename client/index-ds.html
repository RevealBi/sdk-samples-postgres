<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reveal Sdk - Data Sources</title>
    <link rel="stylesheet" href="styles/common.css">
    <style>
        /* Override for this specific page since it doesn't have controls */
        #viewer {
            height: 100vh;
            width: 100%;
        }
    </style>
</head>

<body>
    <div id="viewer"></div>

    <!-- Reveal SDK 2.0 ships as an ES module. Do not use a CDN in production - download the package locally. -->
    <script type="module">
        import { RevealView, RevealSdkSettings, RVPostgresDataSource, RevealDataSources } from "https://cdn.jsdelivr.net/npm/reveal-sdk/dist/reveal-sdk.esm.js";

        RevealSdkSettings.setBaseUrl("http://localhost:5111/");
        var revealView = new RevealView("#viewer");
        revealView.startInEditMode = true;

        revealView.onDataSourcesRequested = (callback) => {
            var postgresDataSource = new RVPostgresDataSource();
            postgresDataSource.id = "postgres1";
            postgresDataSource.title = "Northwind Postgres Data";

            callback(new RevealDataSources([postgresDataSource],
                [], false));
        };
    </script>
</body>

</html>
