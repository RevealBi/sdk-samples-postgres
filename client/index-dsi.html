<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reveal Sdk - Dynamic Data Sources</title>
    <link rel="stylesheet" href="styles/common.css">
</head>

<body>
    <div class="dashboard-controls">
        <div class="control-group">
            <div class="control-item">
                <label class="control-label" for="orderId">Order ID:</label>
                <div class="custom-select">
                    <select name="orders" id="orderId">
                        <option value="10248">10248</option>
                        <option value="10249">10249</option>
                        <option value="10250">10250</option>
                    </select>
                </div>
            </div>
            
            <div class="control-item">
                <label class="control-label" for="userId">User ID:</label>
                <div class="custom-select">
                    <select name="users" id="userId">
                        <option value="ALFKI">ALFKI</option>
                        <option value="ANATR">ANATR</option>
                        <option value="BLAUS">BLAUS</option>
                        <option value="BLONP">BLONP</option>
                    </select>
                </div>
            </div>
        </div>
    </div>
    
    <div id="revealView"></div>

    <!-- Reveal SDK 2.0 ships as an ES module. Do not use a CDN in production - download the package locally. -->
    <script type="module">
        import { RevealView, RevealSdkSettings, RVPostgresDataSource, RVPostgresDataSourceItem, RevealDataSources } from "https://cdn.jsdelivr.net/npm/reveal-sdk/dist/reveal-sdk.esm.js";

        RevealSdkSettings.setBaseUrl("http://localhost:5111/");
        RevealSdkSettings.enableActionsOnHoverTooltip = true;

        const headers = {};

        RevealSdkSettings.setAdditionalHeadersProvider(function (url) {
            return headers;
        });

        var revealView = new RevealView("#revealView");
        revealView.interactiveFilteringEnabled = true;
        revealView.startInEditMode = true;
        revealView.onDataSourcesRequested = (callback) => {
            // Set values to pass to server
            var selectedUserId = document.getElementById('userId').value;
            var selectedOrderId = document.getElementById('orderId').value;

            headers["x-header-one"] = `userId:${selectedUserId},orderId:${selectedOrderId}`;

            console.log(headers["x-header-one"]);

            var postgresDataSource = new RVPostgresDataSource();
            postgresDataSource.id = "postgres";
            postgresDataSource.title = "Postgres Data Source";
            postgresDataSource.subtitle = "Full Northwind Database";

            // Postgres Data Source Items - functions and ad-hoc queries
            var postgresDataSourceItem1 = new RVPostgresDataSourceItem(postgresDataSource);
            postgresDataSourceItem1.id = "CustomerOrders";
            postgresDataSourceItem1.title = "Customer Orders";
            postgresDataSourceItem1.subtitle = "Custom SQL Query (orderId)";

            var postgresDataSourceItem2 = new RVPostgresDataSourceItem(postgresDataSource);
            postgresDataSourceItem2.id = "CustOrderHist";
            postgresDataSourceItem2.title = "Customer Orders History";
            postgresDataSourceItem2.subtitle = "Function (customerId)";

            var postgresDataSourceItem3 = new RVPostgresDataSourceItem(postgresDataSource);
            postgresDataSourceItem3.id = "CustOrdersOrders";
            postgresDataSourceItem3.title = "Customer Orders Orders";
            postgresDataSourceItem3.subtitle = "Function (customerId)";

            var postgresDataSourceItem4 = new RVPostgresDataSourceItem(postgresDataSource);
            postgresDataSourceItem4.id = "TenMostExpensiveProducts";
            postgresDataSourceItem4.title = "Ten Most Expensive Products";
            postgresDataSourceItem4.subtitle = "Function";

            //**********************************************
            // Note, this is the callback that loads everything above into the dialog.  If you don't want to show the entire
            // database, just remove postgresDataSource from the array and leave it empty like this []
            callback(new RevealDataSources([postgresDataSource],
                [postgresDataSourceItem1, postgresDataSourceItem2, postgresDataSourceItem3, postgresDataSourceItem4], false));

            };
    </script>
</body>

</html>
